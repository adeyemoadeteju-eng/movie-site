name: Deploy Vite site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pages' || format('pages-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify Netlify root asset paths
        env:
          NETLIFY: 'true'
          GITHUB_ACTIONS: 'true'
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!html.includes('src="/assets/') || html.includes('src="/movie-site/') || html.includes('href="/movie-site/')) {
            throw new Error('Netlify output must load assets from /assets/, not /movie-site/.');
          }
          console.log('Netlify root asset paths verified.');
          NODE
      - name: Build
        env:
          VITE_KUHI_API_URL: ${{ vars.VITE_KUHI_API_URL }}
          VITE_EMBED_TEMPLATE: ${{ vars.VITE_EMBED_TEMPLATE }}
          VITE_EMBED_NAME: ${{ vars.VITE_EMBED_NAME }}
          VITE_FALLBACK_EMBED_TEMPLATE: ${{ vars.VITE_FALLBACK_EMBED_TEMPLATE }}
          VITE_FALLBACK_EMBED_NAME: ${{ vars.VITE_FALLBACK_EMBED_NAME }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against the production build
        run: npm run test:e2e
      - name: Verify deployed Netlify preview at the domain root
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_BASE_URL: https://deploy-preview-${{ github.event.pull_request.number }}--aniorbit.netlify.app
          PLAYWRIGHT_NETLIFY_SMOKE: 'true'
        run: npx playwright test tests/e2e/netlify-root.spec.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the deployed GitHub Pages site in Chromium
        env:
          PLAYWRIGHT_BASE_URL: https://adeyemoadeteju-eng.github.io
        run: npm run test:e2e
