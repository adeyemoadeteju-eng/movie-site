name: Deploy Vite site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_KUHI_API_URL: ${{ vars.VITE_KUHI_API_URL }}
          VITE_EMBED_TEMPLATE: ${{ vars.VITE_EMBED_TEMPLATE }}
          VITE_EMBED_NAME: ${{ vars.VITE_EMBED_NAME }}
          VITE_FALLBACK_EMBED_TEMPLATE: ${{ vars.VITE_FALLBACK_EMBED_TEMPLATE }}
          VITE_FALLBACK_EMBED_NAME: ${{ vars.VITE_FALLBACK_EMBED_NAME }}
        run: npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser tests against the production build
        run: npm run test:e2e
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
