name: Build AniOrbit Windows app

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate Windows app icons
        run: npm run tauri -- icon src-tauri/icons/aniorbit.svg --output src-tauri/icons

      - name: Build AniOrbit desktop installers
        run: npm run desktop:build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: aniorbit-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
