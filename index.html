
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeFlix</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0b0b10;
  color: #f5f5f7;
  font-family: system-ui, sans-serif;
}

header {
  padding: 22px 6%;
  background: #111119;
  border-bottom: 1px solid #292936;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 26px;
  font-weight: 900;
}

.logo span { color: #a78bfa; }

.header-label {
  color: #9999aa;
  font-size: 12px;
}

.hero {
  padding: 42px 6% 25px;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin: 0 0 8px;
}

.hero p { color: #9999aa; }

.container { padding: 15px 6% 60px; }

.search {
  width: 100%;
  max-width: 550px;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #30303e;
  background: #171721;
  color: white;
  font-size: 15px;
  margin-bottom: 28px;
}

.player-section {
  background: #15151f;
  border: 1px solid #292936;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 35px;
}

video {
  width: 100%;
  max-height: 540px;
  background: black;
  border-radius: 10px;
  display: block;
}

.now-playing { padding: 15px 4px 5px; }

.now-playing h2 {
  margin: 0 0 6px;
  font-size: 21px;
}

#status, #credit {
  color: #9999aa;
  font-size: 13px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 15px;
}

.control-btn {
  border: 1px solid #383847;
  background: #242432;
  color: white;
  padding: 11px 17px;
  border-radius: 9px;
  cursor: pointer;
}

.control-btn:hover {
  background: #39334e;
  border-color: #a78bfa;
}

.section-title {
  font-size: 23px;
  margin: 35px 0 17px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
  gap: 16px;
}

.card {
  background: #171721;
  border: 1px solid #292936;
  border-radius: 13px;
  padding: 15px;
  cursor: pointer;
  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #a78bfa;
}

.card.active {
  border-color: #a78bfa;
  background: #22202f;
}

.card-icon {
  height: 95px;
  background: linear-gradient(135deg,#30234d,#171725);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  margin-bottom: 13px;
}

.card h3 {
  font-size: 14px;
  margin: 0 0 7px;
}

.card p {
  color: #9292a4;
  font-size: 12px;
  margin: 0;
}

.empty {
  display: none;
  color: #9999aa;
  padding: 20px 0;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777789;
  border-top: 1px solid #252532;
  font-size: 12px;
}

@media(max-width:600px) {
  header { padding: 17px 5%; }
  .container,.hero { padding-left: 5%; padding-right: 5%; }
  .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
  .card { padding: 11px; }
  .card-icon { height: 75px; }
}
</style>
</head>

<body>

<header>
  <div class="logo">FREE<span>FLIX</span></div>
  <div class="header-label">PERSONAL MEDIA LIBRARY</div>
</header>

<section class="hero">
  <h1>Welcome to FreeFlix.</h1>
  <p>Your personal movie and episode library.</p>
</section>

<main class="container">

<input
  class="search"
  id="search"
  type="search"
  placeholder="Search movies and episodes..."
>

<section class="player-section">

  <video id="player" controls playsinline></video>

  <div class="now-playing">
    <h2 id="playing-title">Nothing playing yet</h2>
    <p id="status">Choose something from your library.</p>
    <p id="credit"></p>

    <div class="controls">
      <button class="control-btn" id="previous">← Previous</button>
      <button class="control-btn" id="next">Next →</button>
    </div>
  </div>

</section>

<h2 class="section-title">🎬 Movies</h2>
<div class="grid" id="movies-grid"></div>

<h2 class="section-title">✨ Little Witch Academia</h2>
<div class="grid" id="episodes-grid"></div>

<p class="empty" id="empty">No results found.</p>

</main>

<footer>
FREEFLIX · PERSONAL MEDIA LIBRARY
</footer>

<script>

// ======================================
// MOVIES
// ======================================

const movies = [
{
  title: "Elephants Dream",
  icon: "🐘",
  credit: "Blender Foundation",
  src: "https://natuurbeelden.openbeelden.nl/files/92/104101.ed_hd.mp4"
},
{
  title: "Big Buck Bunny",
  icon: "🐰",
  credit: "Blender Foundation",
  src: "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4"
},
{
  title: "Sintel",
  icon: "🐉",
  credit: "Blender Foundation",
  src: ""
},
{
  title: "Tears of Steel",
  icon: "🤖",
  credit: "Blender Foundation",
  src: ""
}
];

// ======================================
// LITTLE WITCH ACADEMIA EPISODES
// Add authorized video URLs in src.
// ======================================

const episodes = [
["Starting Over","E01","✨"],
["Papiliodia","E02","🦋"],
["Don't Stop Me Now","E03","⭐"],
["Night Fall","E04","🌙"],
["Pact of the Dragon","E05","🐉"],
["The Fountain","E06","⛲"],
["Orange Submariner","E07","🚀"],
["Akko's Adventure in Sucyworld","E08","🔮"],
["Undead Travelogue","E09","👻"],
["Bee Affection","E10","🐝"],
["Blue Moon","E11","🌙"],
["What You Will","E12","✨"],
["Samhain Magic Festival","E13","🎃"],
["New Age Magic","E14","🪄"],
["Chariot of Fire","E15","🔥"],
["Pohjola's Ordeal","E16","❄️"],
["Amanda O'Neill and the Holy Grail","E17","🏆"],
["Starship Take Off!","E18","🚀"],
["Cavendish","E19","🌹"],
["Intellect and Sensibility","E20","📚"],
["Discipline","E21","📖"],
["The Things We Said Today","E22","💫"],
["Yesterday","E23","⏳"],
["A Road to Arcturus","E24","🌌"],
["Changing at the Edge of the World","E25","🌍"]
].map(([name,number,icon]) => ({
  title: number + " - " + name,
  number,
  icon,
  category: "episode",
  credit: "Little Witch Academia",
  src: ""
}));

// ======================================
// PLAYER
// ======================================

const video = document.getElementById("player");
const statusEl = document.getElementById("status");
const titleEl = document.getElementById("playing-title");
const creditEl = document.getElementById("credit");

const allItems = [...movies,...episodes];

let currentIndex = -1;
let currentCategory = null;

function playItem(item,category) {

  const list = category === "movie" ? movies : episodes;

  currentCategory = category;
  currentIndex = list.indexOf(item);

  document.querySelectorAll(".card").forEach(card => {
    card.classList.toggle(
      "active",
      card.dataset.title === item.title
    );
  });

  video.pause();
  video.removeAttribute("src");
  video.load();

  titleEl.textContent = item.title;
  creditEl.textContent = item.credit;

  if(!item.src) {
    statusEl.textContent =
      "No authorized video URL has been added for this item yet.";
    return;
  }

  statusEl.textContent = "Loading...";

  video.src = item.src;
  video.load();

  video.play().then(() => {
    statusEl.textContent = "Now playing";
  }).catch(error => {
    statusEl.textContent =
      "Playback error: " + error.message;
  });
}

// ======================================
// NEXT / PREVIOUS
// ======================================

function navigate(direction) {

  if(currentIndex < 0 || !currentCategory) return;

  const list = currentCategory === "movie" ? movies : episodes;

  const newIndex = currentIndex + direction;

  if(newIndex < 0 || newIndex >= list.length) return;

  playItem(list[newIndex],currentCategory);
}

document.getElementById("previous").onclick =
  () => navigate(-1);

document.getElementById("next").onclick =
  () => navigate(1);

// ======================================
// CREATE CARDS
// ======================================

function createCard(item,container,category) {

  const card = document.createElement("div");
  card.className = "card";
  card.dataset.title = item.title.toLowerCase();

  const icon = document.createElement("div");
  icon.className = "card-icon";
  icon.textContent = item.icon;

  const title = document.createElement("h3");
  title.textContent = item.title;

  const description = document.createElement("p");
  description.textContent =
    category === "movie" ? "Movie" : "Episode";

  card.append(icon,title,description);

  card.onclick = () => playItem(item,category);

  container.appendChild(card);
}

movies.forEach(item =>
  createCard(item,document.getElementById("movies-grid"),"movie")
);

episodes.forEach(item =>
  createCard(item,document.getElementById("episodes-grid"),"episode")
);

// ======================================
// SEARCH
// ======================================

document.getElementById("search").addEventListener("input",event => {

  const query = event.target.value.toLowerCase();
  let visible = 0;

  document.querySelectorAll(".card").forEach(card => {

    const matches = card.dataset.title.includes(query);

    card.style.display = matches ? "" : "none";

    if(matches) visible++;
  });

  document.getElementById("empty").style.display =
    visible === 0 ? "block" : "none";
});

</script>

</body>
</html>
