
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Movies</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  button:hover { background: #333; }
  #player { width: 100%; max-width: 900px; display: block; margin: 0 auto; background: #000; }
  #status, #credit { text-align: center; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>

<h1>Free Movies</h1>
<div class="grid" id="grid"></div>
<video id="player" controls playsinline></video>
<p id="status">Pick a movie to start.</p>
<p id="credit"></p>

<script type="module">
import WebTorrent from "https://cdn.jsdelivr.net/npm/webtorrent@latest/dist/webtorrent.min.js";

const announce = [
  "wss://tracker.openwebtorrent.com",
  "wss://tracker.btorrent.io",
  "wss://tracker.fastcast.nz"
];

const movies = [
  {
    title: "Elephants Dream",
    credit: "Elephants Dream © Blender Foundation / Netherlands Media Art Institute | orange.blender.org (CC BY) | hosted by Open Beelden",
    sources: [
      { type: "mp4", src: "https://natuurbeelden.openbeelden.nl/files/92/104101.ed_hd.mp4" },
      { type: "mp4", src: "https://natuurbeelden.openbeelden.nl/files/92/104103.ed_hd.mp4" }
    ]
  },
  {
    title: "Big Buck Bunny",
    credit: "Big Buck Bunny © Blender Foundation | peach.blender.org (CC BY 3.0)",
    sources: [
      { type: "mp4", src: "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4" },
      { type: "torrent", src: "https://webtorrent.io/torrents/big-buck-bunny.torrent" }
    ]
  },
  {
    title: "Sintel",
    credit: "Sintel © Blender Foundation | durian.blender.org (CC BY 3.0)",
    sources: [
      { type: "torrent", src: "https://webtorrent.io/torrents/sintel.torrent" },
      { type: "torrent", src: "magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel" }
    ]
  },
  {
    title: "Tears of Steel",
    credit: "Tears of Steel © Blender Foundation | mango.blender.org (CC BY 3.0)",
    sources: [
      { type: "torrent", src: "https://webtorrent.io/torrents/tears-of-steel.torrent" }
    ]
  },
  {
    title: "Little Witch Academia - E01 Starting Over",
    credit: "Provided by you",
    sources: [
      {
        type: "mp4",
        src: "https://archive.org/download/little-witch-academia-english-sub/E01%20Starting%20Over.mp4"
      }
    ]
  }
];

const client = new WebTorrent();
const video = document.getElementById("player");
const statusEl = document.getElementById("status");
const creditEl = document.getElementById("credit");

let current = null;
let token = 0;
let onVideoFail = null;
let timer = null;

video.addEventListener("error", () => {
  if (onVideoFail) onVideoFail(video.error ? video.error.code : "unknown");
});

video.addEventListener("playing", () => {
  if (onVideoFail) statusEl.textContent = "Playing";
});

client.on("error", () => {});

movies.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m.title;
  b.onclick = () => play(m);
  document.getElementById("grid").appendChild(b);
});

function cleanup() {
  clearTimeout(timer);
  onVideoFail = null;

  if (current) {
    try { current.destroy(); } catch (e) {}
    current = null;
  }
}

function play(m) {
  cleanup();
  video.pause();
  video.removeAttribute("src");
  video.load();

  creditEl.textContent = m.credit;
  tryMovie(m, 0, ++token, []);
}

function tryMovie(m, i, myToken, failures) {
  if (myToken !== token) return;

  if (i >= m.sources.length) {
    statusEl.textContent = "None of the sources worked. Details: " + failures.join(" | ");
    return;
  }

  cleanup();

  const s = m.sources[i];
  const label = "source " + (i + 1) + " of " + m.sources.length;

  const next = (why) => {
    if (myToken !== token) return;
    failures.push(label + ": " + why);
    tryMovie(m, i + 1, myToken, failures);
  };

  if (s.type === "mp4") {
    statusEl.textContent = "Loading (" + label + ")...";

    onVideoFail = (code) => next("video error " + code);

    video.src = s.src;
    video.type = "video/mp4";
    video.load();

    video.play().catch(err => {
      if (myToken === token) {
        statusEl.textContent = "Playback error: " + err.message;
      }
    });

    return;
  }

  statusEl.textContent = "Connecting to peers (" + label + ")...";
  video.removeAttribute("src");
  let started = false;

  timer = setTimeout(() => {
    if (!started) next("no peers after 25s");
  }, 25000);

  const t = client.add(s.src, { announce }, torrent => {
    if (myToken !== token) return;

    const file = torrent.files.find(f => f.name.toLowerCase().endsWith(".mp4"));

    if (!file) {
      next("no mp4 inside torrent");
      return;
    }

    started = true;
    clearTimeout(timer);

    file.streamTo(video);
    video.play().catch(() => {});

    torrent.on("download", () => {
      statusEl.textContent = (torrent.progress * 100).toFixed(1) + "% | " +
        (torrent.downloadSpeed / 1024).toFixed(0) + " KB/s | " +
        torrent.numPeers + " peers";
    });
  });

  current = t;

  t.on("error", err => {
    if (!started) next("torrent error");
  });
}
</script>
</body>
</html>
