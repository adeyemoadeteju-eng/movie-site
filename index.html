<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#11141b"/>
    <meta name="color-scheme" content="dark"/>
    <meta name="description" content="Browse anime, discover new series, and explore episode details on AnimeDex."/>
    <title>AnimeDex</title>
    <style>
      html,body{margin:0;min-height:100%;background:#0d0f14;color:#e9eaf0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      #boot-screen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0d0f14;text-align:center;padding:24px}
      .boot-card{max-width:420px}
      .boot-lockup{display:flex;align-items:center;justify-content:center;gap:9px;font-size:32px;font-weight:800;letter-spacing:-1.4px}
      .boot-lockup b{color:#b0a9ec}
      #boot-status{color:#94a2b9;font-size:13px;line-height:1.65}
      #boot-retry{display:none;margin-top:14px;padding:10px 18px;border:0;border-radius:999px;background:#8179c2;color:#fff;font-weight:800;cursor:pointer}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-lockup"><span>Anime<b>Dex</b></span></div>
        <p id="boot-status">Starting AnimeDex…</p>
        <button id="boot-retry" type="button" onclick="window.__animeDexRetry()">Reload site</button>
      </div>
    </div>
    <noscript><p style="padding:24px;color:#fff">AnimeDex needs JavaScript enabled to display the catalogue.</p></noscript>
    <script>
      window.__animeDexRetry=function(){
        var next=new URL(window.location.href);
        next.searchParams.set('refresh',String(Date.now()));
        window.location.replace(next.href);
      };
      window.setTimeout(function(){
        var status=document.getElementById('boot-status');
        var retry=document.getElementById('boot-retry');
        if(status&&document.getElementById('boot-screen')){
          status.textContent='The app is taking longer than expected to start. Reload to fetch the newest version.';
          if(retry)retry.style.display='inline-block';
        }
      },12000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
