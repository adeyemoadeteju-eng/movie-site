<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Movies</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  button:hover { background: #333; }
  #player { width: 100%; max-width: 900px; display: block; margin: 0 auto; background: #000; }
  #status, #credit { text-align: center; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>
<h1>Free Movies</h1>
<div class="grid" id="grid"></div>
<video id="player" controls></video>
<p id="status">Pick a movie to start.</p>
<p id="credit"></p>

<script type="module">
import WebTorrent from "https://cdn.jsdelivr.net/npm/webtorrent@latest/dist/webtorrent.min.js";

const trackers = "&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&tr=wss%3A%2F%2Ftracker.btorrent.io&tr=wss%3A%2F%2Ftracker.fastcast.nz&ws=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2F";

const movies = [
  { title: "Sintel", hash: "08ada5a7a6183aae1e09d831df6748d566095a10", credit: "Sintel © Blender Foundation | durian.blender.org (CC BY 3.0)" },
  { title: "Big Buck Bunny", hash: "dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c", credit: "Big Buck Bunny © Blender Foundation | peach.blender.org (CC BY 3.0)" },
  { title: "Tears of Steel", hash: "209c8226b299b308beaf2b9cd3fb49212dbd13ec", credit: "Tears of Steel © Blender Foundation | mango.blender.org (CC BY 3.0)" },
  { title: "Elephants Dream", hash: "6a9759bffd5c0af65319979fb7832189f4f3c35d", credit: "Elephants Dream © Blender Foundation | orange.blender.org (CC BY 2.5)" }
];

const client = new WebTorrent();
const video = document.getElementById("player");
const statusEl = document.getElementById("status");
const creditEl = document.getElementById("credit");
let current = null;

movies.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m.title;
  b.onclick = () => play(m);
  document.getElementById("grid").appendChild(b);
});

function play(m) {
  if (current) { current.destroy(); current = null; }
  video.removeAttribute("src");
  statusEl.textContent = "Connecting to peers...";
  creditEl.textContent = m.credit;

  const magnet = `magnet:?xt=urn:btih:${m.hash}&dn=${encodeURIComponent(m.title)}${trackers}`;
  client.add(magnet, torrent => {
    current = torrent;
    const file = torrent.files.find(f => f.name.endsWith(".mp4"));
    file.streamTo(video);
    video.play().catch(() => {});
    torrent.on("download", () => {
      statusEl.textContent = `${(torrent.progress * 100).toFixed(1)}% | ${(torrent.downloadSpeed / 1024).toFixed(0)} KB/s | ${torrent.numPeers} peers`;
    });
  });
}
</script>
</body>
</html>
