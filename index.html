<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Movies</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { text-align: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 20px; }
  button { background: #222; color: #eee; border: 1px solid #444; padding: 12px 18px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  button:hover { background: #333; }
  #player { width: 100%; max-width: 900px; display: block; margin: 0 auto; background: #000; }
  #status, #credit { text-align: center; color: #aaa; margin-top: 10px; }
</style>
</head>
<body>
<h1>Free Movies</h1>
<div class="grid" id="grid"></div>
<video id="player" controls playsinline></video>
<p id="status">Pick a movie to start.</p>
<p id="credit"></p>

<script type="module">
import WebTorrent from "https://cdn.jsdelivr.net/npm/webtorrent@latest/dist/webtorrent.min.js";

const trackers = "&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&tr=wss%3A%2F%2Ftracker.btorrent.io&tr=wss%3A%2F%2Ftracker.fastcast.nz&ws=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2F";

// Each movie can have: url (direct MP4), backup (second MP4 link), or hash (torrent).
const movies = [
  {
    title: "Big Buck Bunny",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
    backup: "https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4",
    credit: "Big Buck Bunny © Blender Foundation | peach.blender.org (CC BY 3.0)"
  },
  {
    title: "Sintel",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
    credit: "Sintel © Blender Foundation | durian.blender.org (CC BY 3.0)"
  },
  {
    title: "Tears of Steel",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
    credit: "Tears of Steel © Blender Foundation | mango.blender.org (CC BY 3.0)"
  },
  {
    title: "Elephants Dream",
    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
    credit: "Elephants Dream © Blender Foundation | orange.blender.org (CC BY 2.5)"
  }
];

const client = new WebTorrent();
const video = document.getElementById("player");
const statusEl = document.getElementById("status");
const creditEl = document.getElementById("credit");
let current = null;
let currentMovie = null;
let triedBackup = false;

video.addEventListener("error", () => {
  if (currentMovie && currentMovie.backup && !triedBackup) {
    triedBackup = true;
    statusEl.textContent = "First link failed, trying backup...";
    video.src = currentMovie.backup;
    video.load();
    video.play().catch(() => {});
    return;
  }
  const code = video.error ? video.error.code : "unknown";
  statusEl.textContent = "Video failed to load (error code " + code + "). The link may have moved or been blocked.";
});

video.addEventListener("playing", () => {
  if (currentMovie && currentMovie.url) statusEl.textContent = "Playing";
});

movies.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m.title;
  b.onclick = () => play(m);
  document.getElementById("grid").appendChild(b);
});

function play(m) {
  if (current) { current.destroy(); current = null; }
  currentMovie = m;
  triedBackup = false;
  creditEl.textContent = m.credit;

  if (m.url) {
    statusEl.textContent = "Loading...";
    video.src = m.url;
    video.load();
    video.play().catch(() => {});
    return;
  }

  video.removeAttribute("src");
  statusEl.textContent = "Connecting to peers...";
  const magnet = `magnet:?xt=urn:btih:${m.hash}&dn=${encodeURIComponent(m.title)}${trackers}`;
  client.add(magnet, torrent => {
    current = torrent;
    const file = torrent.files.find(f => f.name.endsWith(".mp4"));
    file.streamTo(video);
    video.play().catch(() => {});
    torrent.on("download", () => {
      statusEl.textContent = `${(torrent.progress * 100).toFixed(1)}% | ${(torrent.downloadSpeed / 1024).toFixed(0)} KB/s | ${torrent.numPeers} peers`;
    });
  });
}
</script>
</body>
</html>
